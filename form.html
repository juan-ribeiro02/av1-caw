<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <script src="form.js"></script>
    <title>Faça sua reserva</title>
</head>
<body>
    <header>
        
    </header>
    <div class="conteiner">
        <div class="caixa">
            <form action="">
                <label id="nome_cli">nome</label><br>
                <input type="text" id="input_nome_cli"><br>
        
                <label id="email_cli">email</label><br>
                <input type="email" id="input_email_cli"><br>
        
                <label id="telefone_cli">telefone</label><br>
                <input type="tel" id="input_telefone_cli"><br>

                <label id="dia_reserva">dia da reserva</label><br>
                <input type="date" id="input_data_reserva"><br>

                <label id="pessoas">pessoas</label><br>
                <input type="number" id="input_numero_pessoas"><br>

                <label id="horario">horario</label><br>
                <select id="horas">
                    <option value="" selected disabled>-- Escolha um horário --</option>
                    <option value="09:00">09:00</option>
                    <option value="09:00">09:30</option>
                    <option value="09:00">10:00</option>
                    <option value="09:00">10:30</option>
                    <option value="09:00">11:00</option>
                </select>

                <input type="submit" >
            </form>
        </div>
    </div>
</body>
</html>
